<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Instagram</title>
    <meta name="title" content="Connect with friends" />
    <meta
      name="description"
      content="Join Dreamliner to share photos, videos, and connect with friends. A modern social media platform built for everyone."
    />
    <meta
      name="keywords"
      content="social media, photo sharing, connect, friends, dreamliner, instagram clone"
    />
    <meta name="author" content="Muhammad Ridho Amrullah" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dreamliner.com/" />
    <meta property="og:title" content="Dreamliner - Connect with Friends" />
    <meta
      property="og:description"
      content="Join Dreamliner to share photos, videos, and connect with friends."
    />
    <meta
      property="og:image"
      content="http://localhost:3000/assets/images/dreamliner.png"
    />

    <!-- Twitter -->
    <meta
      property="twitter:card"
      content="http://localhost:3000/assets/images/dreamliner.png"
    />
    <meta property="twitter:url" content="https://dreamliner.com/" />
    <meta
      property="twitter:title"
      content="Dreamliner - Connect with Friends"
    />
    <meta
      property="twitter:description"
      content="Join Dreamliner to share photos, videos, and connect with friends."
    />
    <meta
      property="twitter:image"
      content="http://localhost:3000/assets/images/dreamliner.png"
    />

    <!-- Theme Color (browser address bar) -->
    <meta name="theme-color" content="#3d0563" />
    <meta name="msapplication-TileColor" content="#3d0563" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/images/insta192.png" />
    <link rel="apple-touch-icon" href="/assets/images/insta192.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
